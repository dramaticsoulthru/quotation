<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TriS Builders – Quotation Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f3f1ee;--panel:#fff;--tx:#1d1d1f;--mut:#6b6b70;--bd:#d9d6d1;--ac:#7a1f2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171618;--panel:#232124;--tx:#eee;--mut:#a09da3;--bd:#3a373c;--ac:#c4505e}}
:root[data-theme="dark"]{--bg:#171618;--panel:#232124;--tx:#eee;--mut:#a09da3;--bd:#3a373c;--ac:#c4505e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Arial,sans-serif}
.app{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:20px;padding:20px;max-width:1280px;margin:auto}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:16px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}h2:first-child{margin-top:0}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:8px}
textarea{min-height:150px;resize:vertical;font-size:13px}
.item{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.row{display:flex;gap:8px}.row>div{flex:1}
button{font:inherit;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx);padding:8px 12px;cursor:pointer}
button.go{background:var(--ac);border-color:var(--ac);color:#fff;width:100%;margin-top:14px;padding:11px;font-weight:600}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.paper{background:#fff;color:#000;padding:48px;box-shadow:0 2px 14px rgba(0,0,0,.18);overflow-x:auto;width:fit-content;max-width:100%;margin:auto}
#sheet{width:688px;font:13px/1.35 Carlito,Calibri,Arial,sans-serif;color:#000}
.hd{display:flex;gap:18px;align-items:flex-start}.hd img{width:128px;height:128px;object-fit:cover}
.hd table{border-collapse:collapse}.hd td{padding:3px 14px 3px 0;vertical-align:top}
table.b{width:100%;border-collapse:collapse;margin-top:22px}table.b td,table.b th{border:1px solid #000;padding:2px 6px;text-align:left;vertical-align:top;font-weight:400}
.n{width:34px}.u{width:84px}.p{width:100px}
#sheet p{margin:0 0 6px}#sheet .sh{margin:12px 0 4px}#sheet ul{margin:0 0 6px;padding-left:34px}
.tc h3{font-size:13px;font-weight:400;color:#2f5496;margin:14px 0 4px}.tc h3.top{text-transform:uppercase;margin-top:22px}
.tc ul{margin:0 0 4px;padding-left:34px}
.ack td{border:0!important;padding:1px 0!important}
@media print{body{background:#fff}.panel,.app>div:first-child{display:none}.app{display:block;padding:0}.paper{box-shadow:none;padding:0}}
</style></head><body>

const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function scope(t){let o="",n=0,ul=false;const cl=()=>{if(ul){o+="</ul>";ul=false}};
for(let l of t.split("\n")){l=l.trim();if(!l)continue;
if(l[0]=="#"){cl();o+=`<p class="sh">${++n}. ${esc(l.slice(1).trim())}</p>`}
else if(l[0]=="-"){if(!ul){o+="<ul>";ul=true}o+=`<li>${esc(l.slice(1).trim())}</li>`}
else{cl();o+=`<p>${esc(l)}</p>`}}cl();return o}

async function makePdf(){
const el=$("sheet"),S=2,cv=await html2canvas(el,{scale:S,backgroundColor:"#fff",useCORS:true});
const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
const MW=182,MH=273,K=el.offsetWidth/MW,PH=MH*K,H=cv.height/S,T=el.getBoundingClientRect().top;
const rel=n=>n.getBoundingClientRect().bottom-T;
const tabs=[...el.querySelectorAll("table.b:not(.ack)")].map(t=>[t.getBoundingClientRect().top-T,rel(t)]);
const inTab=y=>tabs.some(t=>y>t[0]+2&&y<t[1]-2);
const cands=[...el.querySelectorAll(".hd,li,p,tr")].filter(n=>!n.matches(".sh,.keep")&&!n.closest(".ack")).map(rel).sort((a,b)=>a-b);
const cuts=[0];
while(H-cuts[cuts.length-1]>PH){const s=cuts[cuts.length-1],lim=s+PH;let c=lim;for(const y of cands)if(y>s+60&&y<=lim)c=y;cuts.push(c)}
cuts.push(H);
for(let i=0;i<cuts.length-1;i++){const a=cuts[i],b=cuts[i+1],h=b-a,sy=Math.round(a*S);
const sl=document.createElement("canvas");sl.width=cv.width;sl.height=Math.round(h*S);
const x=sl.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,sl.width,sl.height);
x.drawImage(cv,0,sy,cv.width,Math.min(sl.height,cv.height-sy),0,0,cv.width,Math.min(sl.height,cv.height-sy));
if(i)pdf.addPage();
pdf.addImage(sl.toDataURL("image/jpeg",.95),"JPEG",14,12,MW,h/K);
pdf.setLineWidth(.26);pdf.setDrawColor(0);
if(i&&inTab(a))pdf.line(14,12,196,12);
if(i<cuts.length-2&&inTab(b))pdf.line(14,12+h/K,196,12+h/K)}
return pdf.output("blob")}
$("pdf").onclick=async()=>{const m=$("msg");m.textContent="";
let dl=null;try{dl=await claude.use("downloads")}catch(e){}
if(!dl){window.print();return}
$("pdf").disabled=true;m.textContent="Generating…";
try{const blob=await makePdf();
const nm=("Quotation-"+$("no").value+"-"+$("to").value).replace(/[^\w-]+/g,"_")+".pdf";
await dl.save({filename:nm,data:blob});m.textContent="Done."}
catch(e){m.textContent=e&&e.code=="declined"?"Save cancelled.":"Could not create the PDF."}
$("pdf").disabled=false};
$("date").value||($("date").value=new Date().toISOString().slice(0,10));
build();
